version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      testes:
        patterns: ['@playwright/*', '@axe-core/*', 'vitest', '@lhci/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
